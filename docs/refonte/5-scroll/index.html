<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scrollytelling — Allan Vitu</title>
<meta name="description" content="Prototype 5 — le parcours d'Allan Vitu raconté au fil du défilement.">
<meta name="theme-color" content="#efece4">
<link rel="icon" href="../../assets/brand/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root {
    --display: 'Anton', Impact, 'Arial Narrow', sans-serif;
    --font: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, Consolas, monospace;
    --paper: #efece4;
    --ink: #0d0d0d;
    --grey: #6b6961;
    --hot: #ff4d1c;
    --rule: 2px solid var(--ink);
    color-scheme: light;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--paper); color: var(--ink); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
a { color: inherit; }
img { display: block; max-width: 100%; height: auto; }
::selection { background: var(--hot); color: var(--paper); }
:focus-visible { outline: 3px solid var(--hot); outline-offset: 3px; }
.mono { font-family: var(--mono); font-size: 13px; letter-spacing: 0.02em; }

/* ---------------------------------------------------------------- chrome */
.bar { position: fixed; top: 0; left: 0; height: 4px; width: var(--p, 0%); background: var(--hot); z-index: 100; }
.top { position: fixed; top: 14px; left: 20px; right: 20px; z-index: 90; display: flex; justify-content: space-between; align-items: center; color: var(--ink); pointer-events: none; transition: color 0.3s; }
.top[data-tone='dark'] { color: var(--paper); }
.top a, .top span { pointer-events: auto; font-family: var(--mono); font-size: 13px; text-decoration: none; text-transform: uppercase; letter-spacing: 0.06em; }
.top .logo { font: 400 22px var(--display); letter-spacing: 0.02em; }

/* ---------------------------------------------------------------- 1. hero */
.hero { height: 100svh; display: flex; flex-direction: column; justify-content: flex-end; padding: 0 2vw 3vh; position: relative; overflow: hidden; }
.hero .meta { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-top: var(--rule); padding-top: 12px; margin-top: 2vh; }
.hero h1 { font: 400 22.4vw/0.86 var(--display); letter-spacing: -0.01em; text-transform: uppercase; white-space: nowrap; transform-origin: left bottom; will-change: transform; }
.hero h1 span { display: block; }
.hero h1 span.hot { text-align: right; }
.hero h1 .hot { color: var(--hot); }
.hero .role { font: 400 clamp(22px, 3.2vw, 48px)/1 var(--display); text-transform: uppercase; }
.hero .status { display: inline-flex; align-items: center; gap: 8px; }
.hero .status::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--hot); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: 0.25; } }
.hero .down { position: absolute; top: 40%; right: 3vw; writing-mode: vertical-rl; font-family: var(--mono); font-size: 13px; letter-spacing: 0.2em; text-transform: uppercase; }
.hero .down::after { content: ''; display: inline-block; width: 2px; height: 70px; background: var(--ink); margin-top: 12px; animation: drop 1.8s ease-in-out infinite; transform-origin: top; }
@keyframes drop { 0% { transform: scaleY(0); } 50% { transform: scaleY(1); } 100% { transform: scaleY(1); opacity: 0; } }

/* ---------------------------------------------------------------- 2. manifesto (words light up) */
.manifesto { height: 220vh; position: relative; }
.manifesto .stick { position: sticky; top: 0; height: 100svh; display: grid; align-content: center; padding: 0 6vw; }
.manifesto p.big { font: 400 clamp(40px, 7.4vw, 124px)/0.98 var(--display); text-transform: uppercase; }
.manifesto .w { opacity: 0.12; transition: opacity 0.2s; }
.manifesto .w.on { opacity: 1; }
.manifesto .w.hot.on { color: var(--hot); }
.manifesto .sig { margin-top: 4vh; display: flex; gap: 30px; flex-wrap: wrap; }

/* ---------------------------------------------------------------- 3. parcours (pinned steps) */
.path { position: relative; background: var(--ink); color: var(--paper); }
.path .stick { position: sticky; top: 0; height: 100svh; overflow: hidden; }
.step {
    position: absolute; inset: 0; padding: 12vh 6vw 8vh;
    display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr auto; gap: 4vw;
    opacity: 0; transform: translateY(6vh); transition: opacity 0.6s, transform 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
}
.step.on { opacity: 1; transform: none; pointer-events: auto; }
.step .date { grid-column: 1 / -1; align-self: end; font: 400 clamp(70px, 15vw, 250px)/0.85 var(--display); text-transform: uppercase; color: transparent; -webkit-text-stroke: 2px var(--paper); }
.step.on .date { animation: fill 1.2s 0.2s forwards; }
@keyframes fill { to { color: var(--c, var(--paper)); -webkit-text-stroke-color: var(--c, var(--paper)); } }
.step h3 { font: 400 clamp(34px, 4.6vw, 72px)/0.95 var(--display); text-transform: uppercase; }
.step .org { font-family: var(--mono); font-size: 14px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--c, var(--hot)); margin-top: 12px; }
.step p { font-size: clamp(16px, 1.4vw, 21px); line-height: 1.5; max-width: 42ch; color: #cfccc3; align-self: end; }
.path .counter { position: absolute; left: 6vw; top: 6vh; font-family: var(--mono); font-size: 14px; letter-spacing: 0.1em; z-index: 2; }
.path .counter b { color: var(--hot); font-weight: 500; }
.path .ticks { position: absolute; right: 6vw; top: 6vh; display: flex; gap: 6px; z-index: 2; }
.path .ticks i { width: 36px; height: 4px; background: rgba(239, 236, 228, 0.2); }
.path .ticks i.on { background: var(--hot); }

/* ---------------------------------------------------------------- 4. projects (horizontal gallery) */
.gallery { position: relative; }
.gallery .stick { position: sticky; top: 0; height: 100svh; overflow: hidden; }
.track { display: flex; height: 100%; will-change: transform; }
.panel { flex: none; width: 100vw; height: 100%; padding: 11vh 5vw 6vh; display: grid; border-right: var(--rule); }
.panel.intro { width: 70vw; align-content: end; }
.panel.intro h2 { font: 400 clamp(90px, 19vw, 320px)/0.8 var(--display); text-transform: uppercase; }
.panel.intro p { max-width: 40ch; font-size: 18px; line-height: 1.5; margin-top: 3vh; }
.panel.proj { grid-template-columns: 1.35fr 1fr; grid-template-rows: auto 1fr; gap: 3vh 4vw; }
.panel.proj header { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: end; border-bottom: var(--rule); padding-bottom: 12px; gap: 20px; }
.panel.proj h3 { font: 400 clamp(56px, 9vw, 150px)/0.8 var(--display); text-transform: uppercase; }
.panel.proj .num { font: 400 clamp(40px, 5vw, 80px)/0.8 var(--display); color: var(--hot); }
.panel.proj .media { border: var(--rule); background: var(--ink); overflow: hidden; align-self: start; box-shadow: 12px 12px 0 var(--ink); }
.panel.proj .media img { width: 100%; aspect-ratio: 16 / 9.56; object-fit: cover; object-position: top; }
.panel.proj .copy { display: flex; flex-direction: column; gap: 18px; align-self: start; }
.panel.proj .copy .lead { font-size: clamp(17px, 1.45vw, 22px); line-height: 1.45; font-weight: 500; }
.panel.proj dl { display: grid; grid-template-columns: repeat(2, 1fr); border-top: var(--rule); }
.panel.proj dl div { border-bottom: var(--rule); padding: 10px 0; }
.panel.proj dl div:nth-child(odd) { border-right: var(--rule); }
.panel.proj dl div:nth-child(even) { padding-left: 14px; }
.panel.proj dt { font: 400 clamp(32px, 3.4vw, 54px)/1 var(--display); }
.panel.proj dd { font-family: var(--mono); font-size: 12px; text-transform: uppercase; color: var(--grey); }
.panel.proj .links { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { font: 600 14px var(--font); text-transform: uppercase; letter-spacing: 0.04em; text-decoration: none; padding: 13px 18px; border: var(--rule); background: var(--paper); box-shadow: 4px 4px 0 var(--ink); transition: transform 0.15s, box-shadow 0.15s; }
.btn:hover { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--ink); }
.btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
.btn.hot { background: var(--hot); color: var(--paper); }
.panel.bc { background: #15171f; color: var(--paper); }
.panel.bc header { border-color: var(--paper); }
.panel.bc dl, .panel.bc dl div { border-color: var(--paper) !important; }
.panel.bc dd { color: #a7adbd; }
.panel.bc .media { box-shadow: 12px 12px 0 #fbbf24; border-color: var(--paper); }
.panel.bc .num { color: #fbbf24; }
.panel.bc .btn { color: var(--ink); }
.panel.bc .rack { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.panel.bc .rack span { aspect-ratio: 1; background: #0d0f15; border: 1px solid #333846; display: grid; place-items: center; }
.panel.bc .rack img { width: 84%; }
.panel.bc .rack img.px { width: 60%; image-rendering: pixelated; }
.panel.soon { align-content: center; justify-items: start; background: repeating-linear-gradient(-45deg, transparent 0 22px, rgba(13,13,13,0.06) 22px 44px); }
.panel.soon h3 { font: 400 clamp(90px, 22vw, 360px)/0.8 var(--display); color: transparent; -webkit-text-stroke: 3px var(--ink); text-transform: uppercase; }
.panel.soon p { font-size: 20px; max-width: 36ch; margin-top: 3vh; line-height: 1.45; }

/* ---------------------------------------------------------------- 5. stack marquee */
.stack { border-top: var(--rule); border-bottom: var(--rule); overflow: hidden; padding: 3vh 0; background: var(--paper); }
.stack .row { display: flex; width: max-content; animation: slide 40s linear infinite; }
.stack .row.rev { animation-direction: reverse; animation-duration: 46s; }
.stack .row span { font: 400 clamp(46px, 7vw, 110px)/1.05 var(--display); text-transform: uppercase; padding: 0 0.4em; white-space: nowrap; }
.stack .row span:nth-child(3n+2) { color: transparent; -webkit-text-stroke: 2px var(--ink); }
.stack .row span:nth-child(5n) { color: var(--hot); }
@keyframes slide { to { transform: translateX(-50%); } }

/* ---------------------------------------------------------------- 6. contact */
.contact { background: var(--hot); color: var(--ink); min-height: 100svh; padding: 14vh 4vw 4vh; display: grid; grid-template-rows: 1fr auto; }
.contact h2 { font: 400 clamp(80px, 17vw, 290px)/0.9 var(--display); text-transform: uppercase; }
.contact .mail { display: inline-block; font: 400 clamp(26px, 4.2vw, 68px)/1 var(--display); text-decoration: none; border-bottom: 6px solid var(--ink); margin-top: 5vh; word-break: break-all; }
.contact .mail:hover { color: var(--paper); border-color: var(--paper); }
.contact .foot { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 20px; border-top: var(--rule); padding-top: 14px; }
.contact .foot nav { display: flex; gap: 22px; flex-wrap: wrap; }
.contact .foot a { font-family: var(--mono); font-size: 14px; text-transform: uppercase; }

/* ---------------------------------------------------------------- mobile */
.hero .kicker { position: absolute; top: 14vh; left: 2vw; right: 2vw; display: flex; justify-content: space-between; gap: 20px; font-family: var(--mono); font-size: 13px; text-transform: uppercase; letter-spacing: 0.08em; border-top: var(--rule); padding-top: 10px; }
@media (max-width: 800px) {
    .hero { padding: 0 4vw 3vh; }
    .hero h1 { font-size: 36vw; }
    .hero .kicker { left: 4vw; right: 4vw; flex-direction: column; gap: 6px; }
    .hero .down { display: none; }
    .path .counter { top: 62px; }
    .path .ticks { top: 90px; left: 6vw; right: auto; }
    .path .ticks i { width: 22px; }
    .step { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; padding: 14vh 6vw 6vh; gap: 3vh; }
    .step .date { grid-column: 1; align-self: start; }
    .step p { align-self: start; }
    .panel { padding: 10vh 6vw 5vh; }
    .panel.intro { width: 100vw; }
    .panel.proj { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; overflow-y: auto; }
    .panel.proj .copy .lead { font-size: 16px; }
    .panel.proj .links .btn { padding: 10px 12px; font-size: 12.5px; }
    .panel.bc .rack { grid-template-columns: repeat(6, 1fr); }
}

/* ---------------------------------------------------------------- reduced motion: no pinning, plain vertical story */
html.still .manifesto, html.still .path, html.still .gallery { height: auto !important; }
html.still .stick { position: static; height: auto; }
html.still .manifesto .stick { padding: 18vh 6vw; }
html.still .manifesto .w { opacity: 1; }
html.still .step { position: relative; opacity: 1; transform: none; min-height: 80svh; }
html.still .step .date { color: var(--c, var(--paper)); -webkit-text-stroke: 0; }
html.still .path .counter, html.still .path .ticks { display: none; }
html.still .track { flex-direction: column; transform: none !important; }
html.still .panel { width: 100% !important; min-height: 100svh; border-right: 0; border-bottom: var(--rule); }
html.still .stack .row { animation: none; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="bar" id="bar" aria-hidden="true"></div>
<header class="top">
    <a class="logo" href="#top">A.V.</a>
    <span id="where">Intro</span>
</header>

<main>
    <section class="hero" id="top" data-name="Intro">
        <span class="down" aria-hidden="true">Défiler</span>
        <p class="kicker"><span>Portfolio — 2026</span><span id="kick"></span></p>
        <h1 id="title"></h1>
        <div class="meta">
            <p class="role" id="role"></p>
            <p class="mono status" id="status"></p>
        </div>
    </section>

    <section class="manifesto" id="manifesto" data-name="Manifeste">
        <div class="stick">
            <p class="big" id="words"></p>
            <div class="sig mono" id="sig"></div>
        </div>
    </section>

    <section class="path" id="path" data-name="Parcours" data-tone="dark">
        <div class="stick">
            <p class="counter" aria-hidden="true">Parcours — <b id="count">01</b> / <span id="total"></span></p>
            <div class="ticks" id="ticks" aria-hidden="true"></div>
            <div id="steps"></div>
        </div>
    </section>

    <section class="gallery" id="gallery" data-name="Projets">
        <div class="stick">
            <div class="track" id="track"></div>
        </div>
    </section>

    <section class="stack" aria-label="Technologies" data-name="Stack">
        <div class="row" id="row1" aria-hidden="true"></div>
        <div class="row rev" id="row2" aria-hidden="true"></div>
        <p class="visually-hidden" id="stack-sr" style="position:absolute;left:-9999px"></p>
    </section>

    <section class="contact" id="contact" data-name="Contact">
        <div>
            <h2>Écris-<br>moi.</h2>
            <a class="mail" id="mail"></a>
        </div>
        <div class="foot">
            <p class="mono" id="copy"></p>
            <nav id="soc" aria-label="Réseaux"></nav>
        </div>
    </section>
</main>

<script src="../data.js"></script>
<script>
(() => {
    'use strict';
    const P = window.PORTFOLIO, esc = P.esc, me = P.person;
    const $ = (s) => document.querySelector(s);
    const still = P.reduceMotion;
    if (still) document.documentElement.classList.add('still');

    /* ------------------------------------------------------------ content */
    $('#title').innerHTML = `<span>${esc(me.first)}</span><span class="hot">${esc(me.last)}.</span>`;
    $('#role').textContent = me.role;
    $('#status').textContent = me.status;
    $('#kick').textContent = `${P.projects.length} dépôts · 1 parcours · ${me.location}`;

    // Manifesto: every word is a span; the scroll position lights them one by one.
    const manifesto = 'Je construis des apps web robustes, de l’architecture au pixel. Hors-ligne quand il faut, avec de l’IA quand elle aide, et du code que l’on peut relire.';
    const hot = new Set(['robustes,', 'pixel.', 'Hors-ligne', 'IA', 'relire.']);
    $('#words').innerHTML = manifesto.split(' ').map((w) => `<span class="w${hot.has(w) ? ' hot' : ''}">${esc(w)}</span>`).join(' ');
    $('#sig').innerHTML = `<span>— ${esc(me.name)}</span><span>${esc(me.location)}</span><span>DWWM</span>`;

    const stepColors = ['#efece4', '#8b8dff', '#fbbf24', '#34d399', '#ff4d1c'];
    $('#total').textContent = String(P.parcours.length).padStart(2, '0');
    $('#ticks').innerHTML = P.parcours.map(() => '<i></i>').join('');
    $('#steps').innerHTML = P.parcours.map((s, i) => `
        <article class="step" style="--c:${stepColors[i]}">
            <p class="date">${esc(s.date)}</p>
            <div><h3>${esc(s.title)}</h3><p class="org">${esc(s.org)}</p></div>
            <p>${esc(s.text)}</p>
        </article>`).join('');

    const live = P.projects.filter((p) => p.status === 'live');
    const soon = P.projects.filter((p) => p.status === 'soon');
    $('#track').innerHTML = `
        <div class="panel intro">
            <h2>Projets<br>(${String(P.projects.length).padStart(2, '0')})</h2>
            <p>${live.length} projets en ligne, ${soon.length} en préparation. Le code de chacun est public sur GitHub.</p>
        </div>
        ${live.map((p, i) => `
        <article class="panel proj${p.id === 'boxcraft' ? ' bc' : ''}">
            <header><h3>${esc(p.name)}</h3><span class="num">0${i + 1}</span></header>
            <div class="media"><img src="${p.cover}" alt="${esc(p.shots[0][1])}" loading="lazy"></div>
            <div class="copy">
                <p class="mono">${esc(p.kind)} — ${esc(p.period)}</p>
                <p class="lead">${esc(p.summary)}</p>
                ${p.items ? `<div class="rack">${p.items.map(([n, s, k]) => `<span title="${esc(n)}"><img class="${k === 'px' ? 'px' : ''}" src="${s}" alt="${esc(n)}"></span>`).join('')}</div>` : ''}
                <dl>${p.stats.map(([v, l]) => `<div><dt>${esc(v)}</dt><dd>${esc(l)}</dd></div>`).join('')}</dl>
                <div class="links">
                    ${p.live ? `<a class="btn hot" href="${p.live}" target="_blank" rel="noopener">Ouvrir ↗</a>` : ''}
                    <a class="btn${p.live ? '' : ' hot'}" href="${p.repo}" target="_blank" rel="noopener">Code ↗</a>
                    <a class="btn" href="${p.page}">Étude de cas</a>
                    <a class="btn" href="${P.doc}#${p.id}">Fiche</a>
                </div>
            </div>
        </article>`).join('')}
        ${soon.map((p) => `
        <article class="panel soon">
            <h3>${esc(p.name)}</h3>
            <p>${esc(p.summary)}</p>
            <p style="margin-top:24px"><a class="btn" href="${p.repo}" target="_blank" rel="noopener">Suivre le dépôt ↗</a></p>
        </article>`).join('')}`;

    const tech = P.stack.flatMap((g) => g.items);
    const half = Math.ceil(tech.length / 2);
    const row = (items) => { const s = items.map((t) => `<span>${esc(t)}</span>`).join(''); return s + s; };
    $('#row1').innerHTML = row(tech.slice(0, half));
    $('#row2').innerHTML = row(tech.slice(half));
    $('#stack-sr').textContent = 'Technologies : ' + tech.join(', ');

    $('#mail').href = `mailto:${me.email}`;
    $('#mail').textContent = me.email;
    $('#copy').textContent = `© 2026 ${me.name} — ${me.role}`;
    $('#soc').innerHTML = [['GitHub', me.github], ['LinkedIn', me.linkedin], ['Instagram', me.instagram], ['Fiche technique', P.doc]]
        .map(([l, h]) => `<a href="${h}"${h.startsWith('http') ? ' target="_blank" rel="noopener"' : ''}>${l} ↗</a>`).join('');

    /* ------------------------------------------------------------ scroll engine */
    const hero = $('#title'), man = $('#manifesto'), path = $('#path'), gal = $('#gallery'), track = $('#track');
    const words = [...document.querySelectorAll('#words .w')];
    const steps = [...document.querySelectorAll('.step')];
    const ticks = [...document.querySelectorAll('#ticks i')];
    const sections = [...document.querySelectorAll('[data-name]')];

    // Pinned sections get a height proportional to what they show.
    const size = () => {
        if (still) return;
        path.style.height = `${P.parcours.length * 100}svh`;
        gal.style.height = `${track.scrollWidth - innerWidth + innerHeight}px`;
    };
    const progress = (el) => {
        const r = el.getBoundingClientRect();
        const run = el.offsetHeight - innerHeight;
        return run > 0 ? Math.min(1, Math.max(0, -r.top / run)) : 0;
    };

    let ticking = false;
    function frame() {
        ticking = false;
        const max = document.documentElement.scrollHeight - innerHeight;
        $('#bar').style.setProperty('--p', `${(scrollY / Math.max(1, max)) * 100}%`);
        const cur = sections.filter((s) => s.getBoundingClientRect().top <= innerHeight * 0.5).pop();
        $('#where').textContent = cur ? cur.dataset.name : 'Intro';
        $('.top').dataset.tone = cur?.dataset.tone || 'light';
        if (still) return;

        // Hero: the name leans back and shrinks as you leave.
        const h = Math.min(1, scrollY / innerHeight);
        hero.style.transform = `translateY(${-h * 12}vh) scale(${1 - h * 0.18})`;
        hero.style.opacity = String(1 - h * 0.6);

        // Manifesto: light up the first n words.
        const mp = progress(man);
        const lit = Math.round(mp * 1.25 * words.length);
        words.forEach((w, i) => w.classList.toggle('on', i < lit));

        // Parcours: one step per viewport of scroll.
        const pp = progress(path);
        const idx = Math.min(steps.length - 1, Math.floor(pp * steps.length));
        steps.forEach((s, i) => s.classList.toggle('on', i === idx));
        ticks.forEach((t, i) => t.classList.toggle('on', i <= idx));
        $('#count').textContent = String(idx + 1).padStart(2, '0');

        // Gallery: vertical scroll drives a horizontal track.
        const gp = progress(gal);
        track.style.transform = `translate3d(${-gp * (track.scrollWidth - innerWidth)}px, 0, 0)`;
    }
    const onScroll = () => { if (!ticking) { ticking = true; requestAnimationFrame(frame); } };
    addEventListener('scroll', onScroll, { passive: true });
    addEventListener('resize', () => { size(); frame(); });
    addEventListener('load', () => { size(); frame(); });
    size();
    frame();
})();
</script>
</body>
</html>

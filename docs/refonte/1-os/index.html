<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>allan.os — Allan Vitu</title>
<meta name="description" content="Prototype 1 — le portfolio d'Allan Vitu sous forme de bureau d'ordinateur.">
<link rel="icon" href="../../assets/brand/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root {
    --font: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, Consolas, monospace;
    --wall-1: #0b0d1a;
    --glass: rgba(20, 22, 32, 0.78);
    --glass-strong: rgba(14, 16, 24, 0.92);
    --line: rgba(255, 255, 255, 0.09);
    --line-strong: rgba(255, 255, 255, 0.16);
    --text: #eceef4;
    --muted: #a3a9ba;
    --subtle: #767d91;
    --indigo: #818cf8;
    --amber: #fbbf24;
    --emerald: #34d399;
    --rose: #fb7185;
    --r: 14px;
    --menubar: 34px;
    --shadow: 0 30px 80px rgba(0, 0, 0, 0.55), 0 0 0 1px var(--line);
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
    font-family: var(--font);
    color: var(--text);
    background: var(--wall-1);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
    user-select: none;
}
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; max-width: 100%; }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; border-radius: 6px; }

/* ---------------------------------------------------------------- wallpaper */
.wallpaper {
    position: fixed; inset: 0; z-index: 0; overflow: hidden;
    background:
        radial-gradient(60vw 50vh at 18% 20%, rgba(99, 102, 241, 0.42), transparent 70%),
        radial-gradient(50vw 45vh at 85% 75%, rgba(251, 191, 36, 0.20), transparent 70%),
        radial-gradient(40vw 40vh at 70% 10%, rgba(52, 211, 153, 0.18), transparent 70%),
        linear-gradient(160deg, #0d1022, #07080f 60%);
}
.wallpaper::after {
    content: ''; position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.06) 1px, transparent 1px);
    background-size: 26px 26px;
    mask-image: radial-gradient(ellipse at center, #000 30%, transparent 80%);
}
.wallpaper .sign {
    position: absolute; right: 4vw; bottom: 110px;
    font-weight: 700; font-size: clamp(3rem, 9vw, 8.5rem); letter-spacing: -0.05em; line-height: 0.9;
    color: rgba(255, 255, 255, 0.045); text-align: right;
}

/* ---------------------------------------------------------------- menubar */
.menubar {
    position: fixed; inset: 0 0 auto 0; height: var(--menubar); z-index: 5000;
    display: flex; align-items: center; gap: 18px; padding: 0 14px;
    background: rgba(10, 11, 18, 0.55);
    backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%);
    border-bottom: 1px solid var(--line);
    font-size: 13px;
}
.menubar .brand { font-weight: 700; display: flex; align-items: center; gap: 8px; }
.menubar .brand i { width: 14px; height: 14px; border-radius: 4px; background: conic-gradient(var(--indigo), var(--emerald), var(--amber), var(--indigo)); }
.menubar nav { display: flex; gap: 4px; }
.menubar nav button { padding: 4px 9px; border-radius: 6px; color: var(--muted); }
.menubar nav button:hover { background: rgba(255,255,255,0.08); color: var(--text); }
.menubar .right { margin-left: auto; display: flex; align-items: center; gap: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.menubar .status { display: inline-flex; align-items: center; gap: 7px; color: var(--text); }
.menubar .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 0 3px rgba(52,211,153,0.2); }

/* ---------------------------------------------------------------- desktop icons */
.desktop {
    position: fixed; inset: var(--menubar) 0 0 0; z-index: 1;
    padding: 22px 18px 110px;
    display: grid; grid-auto-flow: column; grid-template-rows: repeat(auto-fill, 104px);
    grid-auto-columns: 96px; gap: 6px 8px; align-content: start;
}
.icon {
    display: flex; flex-direction: column; align-items: center; gap: 7px;
    padding: 8px 4px; border-radius: 12px; text-align: center;
    font-size: 12px; line-height: 1.25; color: var(--text);
    text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    border: 1px solid transparent;
    transition: background 0.15s;
}
.icon:hover, .icon:focus-visible { background: rgba(255,255,255,0.08); border-color: var(--line); }
.icon .glyph {
    width: 54px; height: 54px; border-radius: 14px;
    display: grid; place-items: center; font-size: 26px;
    background: linear-gradient(145deg, rgba(255,255,255,0.16), rgba(255,255,255,0.04));
    border: 1px solid var(--line-strong);
    box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.12);
    position: relative;
}
.icon .glyph img { width: 34px; height: 34px; image-rendering: pixelated; }
.icon .badge {
    position: absolute; top: -6px; right: -10px;
    font-size: 9px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
    padding: 2px 6px; border-radius: 99px; background: var(--emerald); color: #04130d;
}

/* ---------------------------------------------------------------- windows */
.win {
    position: absolute; z-index: 10;
    width: min(620px, 92vw); height: min(460px, 78vh);
    min-width: 320px; min-height: 220px;
    display: flex; flex-direction: column;
    background: var(--glass);
    backdrop-filter: blur(26px) saturate(150%); -webkit-backdrop-filter: blur(26px) saturate(150%);
    border-radius: var(--r);
    box-shadow: var(--shadow);
    overflow: hidden;
    resize: both;
    animation: pop 0.28s var(--ease);
}
.win[hidden] { display: none; }
.win.is-max { inset: calc(var(--menubar) + 8px) 8px 96px 8px !important; width: auto !important; height: auto !important; resize: none; }
.win.is-active { box-shadow: 0 40px 100px rgba(0,0,0,0.65), 0 0 0 1px var(--line-strong); }
.win:not(.is-active) .titlebar { opacity: 0.7; }
@keyframes pop { from { opacity: 0; transform: scale(0.96) translateY(8px); } }

.titlebar {
    flex: none; height: 40px; display: flex; align-items: center; gap: 12px;
    padding: 0 12px; cursor: grab; touch-action: none;
    border-bottom: 1px solid var(--line);
    background: rgba(255,255,255,0.03);
}
.titlebar:active { cursor: grabbing; }
.lights { display: flex; gap: 8px; }
.lights button { width: 13px; height: 13px; border-radius: 50%; position: relative; }
.lights button::after { content: ''; position: absolute; inset: -6px; }
.lights .close { background: var(--rose); }
.lights .min { background: var(--amber); }
.lights .max { background: var(--emerald); }
.lights:hover button { filter: brightness(1.15); }
.titlebar h2 { font-size: 13px; font-weight: 600; color: var(--muted); flex: 1; text-align: center; margin-right: 50px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.win-body { flex: 1; overflow: auto; user-select: text; }
.win-body::-webkit-scrollbar { width: 10px; }
.win-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.14); border-radius: 99px; border: 3px solid transparent; background-clip: content-box; }

/* ---------------------------------------------------------------- dock */
.dock {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 5000;
    display: flex; gap: 6px; padding: 8px;
    background: rgba(18, 20, 30, 0.55);
    backdrop-filter: blur(22px) saturate(160%); -webkit-backdrop-filter: blur(22px) saturate(160%);
    border: 1px solid var(--line-strong); border-radius: 20px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
}
.dock button {
    width: 50px; height: 50px; border-radius: 13px; font-size: 24px;
    display: grid; place-items: center; position: relative;
    background: linear-gradient(145deg, rgba(255,255,255,0.14), rgba(255,255,255,0.03));
    border: 1px solid var(--line);
    transition: transform 0.2s var(--ease);
}
.dock button img { width: 30px; height: 30px; image-rendering: pixelated; }
.dock button:hover { transform: translateY(-6px) scale(1.08); }
.dock button.is-open::after { content: ''; position: absolute; bottom: -6px; width: 4px; height: 4px; border-radius: 50%; background: var(--text); }
.dock .sep { width: 1px; background: var(--line-strong); margin: 4px 2px; }
.dock button .tip {
    position: absolute; bottom: calc(100% + 12px); left: 50%; transform: translateX(-50%);
    font-size: 12px; padding: 4px 9px; border-radius: 7px; white-space: nowrap;
    background: var(--glass-strong); border: 1px solid var(--line); pointer-events: none;
    opacity: 0; transition: opacity 0.15s;
}
.dock button:hover .tip, .dock button:focus-visible .tip { opacity: 1; }

/* ---------------------------------------------------------------- app contents */
.pad { padding: 22px 24px; }
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 12px var(--mono); padding: 3px 9px; border-radius: 7px; border: 1px solid var(--line-strong); color: var(--muted); background: rgba(255,255,255,0.03); }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.btn {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 9px; text-decoration: none;
    border: 1px solid var(--line-strong); background: rgba(255,255,255,0.05);
    transition: background 0.15s, transform 0.15s;
}
.btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-1px); }
.btn.primary { background: var(--accent, var(--indigo)); border-color: transparent; color: #0b0c12; }
.btn.primary:hover { filter: brightness(1.08); }

/* about */
.about { display: grid; grid-template-columns: 120px 1fr; gap: 22px; align-items: start; }
.about .avatar { width: 120px; height: 120px; border-radius: 26px; object-fit: cover; border: 1px solid var(--line-strong); }
.about h3 { font-size: 24px; letter-spacing: -0.02em; }
.about p { color: var(--muted); font-size: 14px; line-height: 1.65; margin-top: 10px; }
.stackgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; margin-top: 20px; }
.stackgrid h4 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--subtle); margin-bottom: 7px; }

/* text editor — one grid row per logical line, so wrapped lines keep their number aligned */
.editor { font: 13px/1.75 var(--mono); min-height: calc(100% - 26px); padding: 14px 0; background: linear-gradient(90deg, rgba(0,0,0,0.18) 52px, transparent 52px); }
.editor .row { display: grid; grid-template-columns: 52px 1fr; }
.editor .row > i { font-style: normal; text-align: right; padding-right: 14px; color: var(--subtle); user-select: none; border-right: 1px solid var(--line); }
.editor .row > span { padding: 0 20px; white-space: pre-wrap; min-height: 1.75em; }
.editor .row > span.in { padding-left: calc(20px + 4ch); }
.editor .h { color: var(--amber); }
.editor .d { color: var(--emerald); }
.editor .c { color: var(--subtle); }
.editor .l { color: var(--indigo); text-decoration: underline; cursor: pointer; }
.statusbar { position: sticky; bottom: 0; display: flex; justify-content: space-between; padding: 5px 14px; font: 11px var(--mono); color: var(--subtle); background: #11131b; border-top: 1px solid var(--line); }

/* identity widget */
.widget {
    position: fixed; top: calc(var(--menubar) + 18px); right: 18px; z-index: 2; width: 270px;
    padding: 18px; border-radius: 20px; user-select: text;
    background: rgba(18, 20, 30, 0.5); border: 1px solid var(--line-strong);
    backdrop-filter: blur(22px); -webkit-backdrop-filter: blur(22px);
    display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center;
}
.widget img { width: 56px; height: 56px; border-radius: 16px; object-fit: cover; }
.widget b { display: block; font-size: 17px; letter-spacing: -0.01em; }
.widget span { font-size: 12.5px; color: var(--muted); }
.widget p { grid-column: 1 / -1; font-size: 13px; color: var(--muted); line-height: 1.5; border-top: 1px solid var(--line); padding-top: 12px; }
.widget kbd { font: 11px var(--mono); padding: 1px 6px; border-radius: 5px; border: 1px solid var(--line-strong); color: var(--text); }

/* terminal */
.term { font: 13px/1.65 var(--mono); padding: 14px 16px; min-height: 100%; background: rgba(4,5,9,0.55); cursor: text; }
.term .out { white-space: pre-wrap; }
.term .ok { color: var(--emerald); }
.term .warn { color: var(--amber); }
.term .acc { color: var(--indigo); }
.term .dim { color: var(--subtle); }
.term form { display: flex; gap: 8px; }
.term input { flex: 1; font: inherit; color: inherit; background: none; border: 0; outline: none; caret-color: var(--emerald); }

/* project app */
.app { display: grid; grid-template-columns: 170px 1fr; min-height: 100%; }
.app aside { padding: 16px 10px; border-right: 1px solid var(--line); background: rgba(0,0,0,0.15); display: flex; flex-direction: column; gap: 3px; }
.app aside .appname { display: flex; align-items: center; gap: 9px; font-weight: 700; padding: 4px 8px 14px; }
.app aside button { text-align: left; font-size: 13px; padding: 7px 10px; border-radius: 8px; color: var(--muted); }
.app aside button[aria-selected='true'] { background: rgba(255,255,255,0.08); color: var(--text); }
.app aside button:hover { color: var(--text); }
.app section { padding: 22px 24px; }
.app section[hidden] { display: none; }
.app h3 { font-size: 22px; letter-spacing: -0.02em; }
.app .tagline { color: var(--muted); margin-top: 6px; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 18px 0; }
.stats div { padding: 12px; border-radius: 11px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); }
.stats b { display: block; font-size: 24px; letter-spacing: -0.03em; color: var(--accent); }
.stats span { font-size: 12px; color: var(--muted); }
.story { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 18px; }
.story h4 { font: 11px var(--mono); text-transform: uppercase; letter-spacing: 0.1em; color: var(--accent); margin-bottom: 6px; }
.story p { font-size: 13.5px; color: var(--muted); line-height: 1.6; }
.gallery .main { border-radius: 10px; overflow: hidden; border: 1px solid var(--line); aspect-ratio: 16/9.56; background: #0b0d14; }
.gallery .main img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.gallery .thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; padding-bottom: 4px; }
.gallery .thumbs button { flex: none; width: 96px; border-radius: 7px; overflow: hidden; border: 2px solid transparent; opacity: 0.6; }
.gallery .thumbs button[aria-current='true'] { border-color: var(--accent); opacity: 1; }
.gallery figcaption { font-size: 12px; color: var(--subtle); margin-top: 8px; }
.hl { list-style: none; display: grid; gap: 8px; margin: 14px 0 18px; }
.hl li { font-size: 13.5px; padding-left: 20px; position: relative; color: var(--muted); }
.hl li::before { content: '▸'; position: absolute; left: 2px; color: var(--accent); }

/* inventory (BoxCraft) */
.inv { margin: 16px 0; padding: 12px; border-radius: 6px; background: #c6c6c6; box-shadow: inset 2px 2px 0 #fff, inset -2px -2px 0 #555; }
.inv h4 { font: 12px var(--mono); color: #3f3f3f; margin-bottom: 8px; }
.inv .slots { display: grid; grid-template-columns: repeat(auto-fill, 54px); gap: 4px; }
.slot { width: 54px; height: 54px; background: #8b8b8b; box-shadow: inset 2px 2px 0 #373737, inset -2px -2px 0 #fff; display: grid; place-items: center; position: relative; }
.slot img { width: 40px; height: 40px; }
.slot img.px { image-rendering: pixelated; width: 36px; height: 36px; }
.slot:hover, .slot:focus-visible { background: #a4a4a4; }
.slot .tt {
    position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); z-index: 2;
    white-space: nowrap; font: 12px var(--mono); color: #fff; padding: 4px 7px;
    background: #100010; border: 2px solid #2a0a5e; border-radius: 3px;
    opacity: 0; pointer-events: none; transition: opacity 0.1s;
}
.slot:hover .tt, .slot:focus-visible .tt { opacity: 1; }

/* installer (App) */
.installer { display: grid; place-items: center; text-align: center; min-height: 100%; padding: 30px; gap: 14px; }
.installer .big { font-size: 52px; }
.bar { width: min(320px, 80%); height: 8px; border-radius: 99px; background: rgba(255,255,255,0.08); overflow: hidden; margin: 6px auto; }
.bar i { display: block; height: 100%; width: 12%; background: linear-gradient(90deg, var(--emerald), #6ee7b7); border-radius: inherit; animation: pulse 2.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: 0.55; } }

/* contact */
.mail { font-size: 14px; }
.mail .row { display: flex; gap: 12px; padding: 11px 22px; border-bottom: 1px solid var(--line); }
.mail .row span { width: 60px; color: var(--subtle); }
.mail .body { padding: 20px 22px; color: var(--muted); line-height: 1.7; }

/* ---------------------------------------------------------------- mobile: a phone home screen */
@media (max-width: 760px) {
    body { overflow: auto; }
    .menubar nav, .menubar .clock-date { display: none; }
    .desktop { position: relative; inset: auto; padding: calc(var(--menubar) + 24px) 16px 120px; grid-auto-flow: row; grid-template-rows: none; grid-template-columns: repeat(4, 1fr); grid-auto-columns: auto; }
    .wallpaper .sign { bottom: 130px; }
    .widget { position: relative; top: auto; right: auto; width: auto; margin: calc(var(--menubar) + 16px) 16px 0; }
    .desktop { padding-top: 22px; }
    .win, .win.is-max { position: fixed; inset: var(--menubar) 0 0 0 !important; width: auto !important; height: auto !important; border-radius: 0; resize: none; }
    .titlebar { cursor: default; }
    .lights .min, .lights .max { display: none; }
    .dock { display: none; }
    .about { grid-template-columns: 1fr; }
    .app { grid-template-columns: 1fr; }
    .app aside { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    .app aside .appname { display: none; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    .story, .stackgrid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>

<div class="wallpaper" aria-hidden="true"><div class="sign">allan<br>vitu</div></div>

<header class="menubar">
    <span class="brand"><i aria-hidden="true"></i>allan.os</span>
    <nav aria-label="Menu">
        <button type="button" data-open="about">À propos</button>
        <button type="button" data-open="parcours">Parcours</button>
        <button type="button" data-open="devtoolbox">Projets</button>
        <button type="button" data-open="contact">Contact</button>
    </nav>
    <div class="right">
        <span class="status" id="status"></span>
        <span class="clock-date" id="date"></span>
        <span id="clock"></span>
    </div>
</header>

<aside class="widget" id="widget" aria-label="Carte de visite"></aside>
<main class="desktop" id="desktop" aria-label="Bureau"></main>
<div id="windows"></div>
<nav class="dock" id="dock" aria-label="Dock"></nav>

<script src="../data.js"></script>
<script>
(() => {
    'use strict';
    const P = window.PORTFOLIO;
    const esc = P.esc;
    const me = P.person;
    const $ = (s, r = document) => r.querySelector(s);
    const mobile = () => matchMedia('(max-width: 760px)').matches;

    $('#status').textContent = me.status;
    $('#widget').innerHTML = `
        <img src="${me.avatar}" alt="Portrait d’Allan Vitu">
        <div><b>${esc(me.name)}</b><span>${esc(me.role)}</span></div>
        <p>${esc(me.pitch)} Ouvre une icône, ou le <button type="button" data-open="terminal" style="text-decoration:underline">terminal</button> et tape <kbd>help</kbd>.</p>`;

    /* ------------------------------------------------------------ clock */
    const tick = () => {
        const d = new Date();
        $('#clock').textContent = d.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
        $('#date').textContent = d.toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' });
    };
    tick(); setInterval(tick, 15000);

    /* ------------------------------------------------------------ apps */
    const pixel = (src, alt = '') => `<img src="${src}" alt="${esc(alt)}">`;
    const bc = P.byId('boxcraft');

    const APPS = {
        about:      { title: 'À propos — Allan Vitu', label: 'À propos', glyph: '👤', w: 540, h: 500, at: [0.15, 0.1], render: renderAbout },
        parcours:   { title: 'parcours.txt — Éditeur', label: 'parcours.txt', glyph: '📄', w: 580, h: 470, at: [0.44, 0.3], render: renderParcours },
        terminal:   { title: 'allan@os: ~', label: 'Terminal', glyph: '⌨️', w: 600, h: 380, render: renderTerminal },
        devtoolbox: { title: 'DevToolbox', label: 'DevToolbox', glyph: '🧰', w: 760, h: 560, render: (b) => renderProject(b, 'devtoolbox') },
        boxcraft:   { title: 'BoxCraft', label: 'BoxCraft', glyph: pixel(bc.items[5][1]), w: 760, h: 580, render: (b) => renderProject(b, 'boxcraft') },
        app:        { title: 'App — Installation', label: 'App', glyph: '🚀', badge: 'bientôt', w: 440, h: 340, render: renderApp },
        contact:    { title: 'Nouveau message', label: 'Contact', glyph: '✉️', w: 520, h: 400, render: renderContact },
        fiche:      { title: 'Fiche technique', label: 'fiche-technique.html', glyph: '📑', href: P.doc },
    };

    /* ------------------------------------------------------------ desktop + dock */
    const desk = $('#desktop');
    desk.innerHTML = Object.entries(APPS).map(([id, a]) => `
        <button class="icon" type="button" data-open="${id}">
            <span class="glyph" aria-hidden="true">${a.glyph}${a.badge ? `<span class="badge">${a.badge}</span>` : ''}</span>
            <span>${esc(a.label)}</span>
        </button>`).join('');

    const dockIds = ['about', 'parcours', 'terminal', null, 'devtoolbox', 'boxcraft', 'app', null, 'contact'];
    $('#dock').innerHTML = dockIds.map((id) => id === null ? '<span class="sep" aria-hidden="true"></span>' : `
        <button type="button" data-open="${id}" data-dock="${id}" aria-label="${esc(APPS[id].label)}">
            <span aria-hidden="true">${APPS[id].glyph}</span><span class="tip">${esc(APPS[id].label)}</span>
        </button>`).join('');

    document.addEventListener('click', (e) => {
        const t = e.target.closest('[data-open]');
        if (t) open(t.dataset.open);
    });

    /* ------------------------------------------------------------ window manager */
    const layer = $('#windows');
    const wins = new Map();
    let z = 20;
    let cascade = 0;

    function open(id) {
        const app = APPS[id];
        if (!app) return;
        if (app.href) { window.open(app.href, '_blank', 'noopener'); return; }
        let w = wins.get(id);
        if (!w) {
            w = create(id, app);
            wins.set(id, w);
        }
        w.hidden = false;
        focus(w);
        syncDock();
    }

    function create(id, app) {
        const w = document.createElement('section');
        w.className = 'win';
        w.setAttribute('role', 'dialog');
        w.setAttribute('aria-label', app.title);
        w.dataset.id = id;
        w.innerHTML = `
            <header class="titlebar">
                <div class="lights">
                    <button class="close" type="button" aria-label="Fermer"></button>
                    <button class="min" type="button" aria-label="Réduire"></button>
                    <button class="max" type="button" aria-label="Agrandir"></button>
                </div>
                <h2>${esc(app.title)}</h2>
            </header>
            <div class="win-body"></div>`;
        layer.appendChild(w);
        app.render($('.win-body', w), w);

        // Size + cascade position, clamped to the viewport.
        const vw = innerWidth, vh = innerHeight;
        const ww = Math.min(app.w, vw - 40), wh = Math.min(app.h, vh - 150);
        w.style.width = ww + 'px';
        w.style.height = wh + 'px';
        const [fx, fy] = app.at || [];
        const left = Math.max(12, Math.min(fx !== undefined ? vw * fx : (vw - ww) / 2 + (cascade % 5) * 32 - 4, vw - ww - 12));
        const top = Math.max(46, Math.min(fy !== undefined ? vh * fy : (vh - wh) / 2 + (cascade % 5) * 28 - 60, vh - wh - 100));
        w.style.left = left + 'px';
        w.style.top = top + 'px';
        cascade++;

        $('.close', w).addEventListener('click', (e) => { e.stopPropagation(); w.hidden = true; syncDock(); });
        $('.min', w).addEventListener('click', (e) => { e.stopPropagation(); w.hidden = true; syncDock(); });
        $('.max', w).addEventListener('click', (e) => { e.stopPropagation(); w.classList.toggle('is-max'); });
        $('.titlebar', w).addEventListener('dblclick', () => w.classList.toggle('is-max'));
        w.addEventListener('pointerdown', () => focus(w));
        drag(w);
        return w;
    }

    function focus(w) {
        wins.forEach((o) => o.classList.remove('is-active'));
        w.classList.add('is-active');
        w.style.zIndex = ++z;
    }

    function syncDock() {
        document.querySelectorAll('[data-dock]').forEach((b) => {
            const w = wins.get(b.dataset.dock);
            b.classList.toggle('is-open', !!w && !w.hidden);
        });
    }

    function drag(w) {
        const bar = $('.titlebar', w);
        let sx, sy, ox, oy, id = null;
        bar.addEventListener('pointerdown', (e) => {
            if (mobile() || e.target.closest('button') || w.classList.contains('is-max')) return;
            id = e.pointerId;
            bar.setPointerCapture(id);
            sx = e.clientX; sy = e.clientY; ox = w.offsetLeft; oy = w.offsetTop;
        });
        bar.addEventListener('pointermove', (e) => {
            if (e.pointerId !== id) return;
            const x = Math.max(-w.offsetWidth + 80, Math.min(innerWidth - 80, ox + e.clientX - sx));
            const y = Math.max(34, Math.min(innerHeight - 60, oy + e.clientY - sy));
            w.style.left = x + 'px';
            w.style.top = y + 'px';
        });
        const end = () => { id = null; };
        bar.addEventListener('pointerup', end);
        bar.addEventListener('pointercancel', end);
    }

    document.addEventListener('keydown', (e) => {
        if (e.key !== 'Escape') return;
        const top = [...wins.values()].filter((w) => !w.hidden).sort((a, b) => b.style.zIndex - a.style.zIndex)[0];
        if (top) { top.hidden = true; syncDock(); }
    });

    /* ------------------------------------------------------------ renderers */
    function renderAbout(b) {
        b.innerHTML = `<div class="pad">
            <div class="about">
                <img class="avatar" src="${me.avatar}" alt="Portrait d’Allan Vitu">
                <div>
                    <h3>${esc(me.name)}</h3>
                    <p class="mono" style="margin-top:4px;color:var(--indigo)">${esc(me.role)}</p>
                    ${me.bio.map((t) => `<p>${esc(t)}</p>`).join('')}
                </div>
            </div>
            <div class="stackgrid">
                ${P.stack.map((g) => `<div><h4>${esc(g.group)}</h4><div class="chips">${g.items.map((i) => `<span class="chip">${esc(i)}</span>`).join('')}</div></div>`).join('')}
            </div>
        </div>`;
    }

    function renderParcours(b) {
        // [html, indented?]
        const lines = [
            [`<span class="c"># parcours.txt — ${esc(me.name)}</span>`],
            [`<span class="c"># ${esc(me.role)}</span>`],
            [''],
        ];
        P.parcours.forEach((s) => {
            lines.push([`<span class="d">[${esc(s.date)}]</span> <span class="h">${esc(s.title)}</span>`]);
            lines.push([esc(s.org), true]);
            lines.push([esc(s.text), true]);
            if (s.project) lines.push([`→ <span class="l" data-open="${s.project}">ouvrir ${esc(P.byId(s.project).name)}</span>`, true]);
            lines.push(['']);
        });
        b.innerHTML = `<div class="editor">${lines.map(([html, indent], i) =>
            `<div class="row"><i>${i + 1}</i><span${indent ? ' class="in"' : ''}>${html}</span></div>`).join('')}</div>
            <div class="statusbar"><span>UTF-8 · LF</span><span>${lines.length} lignes</span></div>`;
    }

    function renderTerminal(b) {
        b.innerHTML = `<div class="term"><div class="out" aria-live="polite"></div><form><span class="ok">allan@os</span><span class="dim">:~$</span><input aria-label="Commande" autocomplete="off" spellcheck="false"></form></div>`;
        const out = $('.out', b), input = $('input', b), term = $('.term', b);
        term.addEventListener('click', () => input.focus());
        const print = (html) => { out.insertAdjacentHTML('beforeend', html + '\n'); b.scrollTop = b.scrollHeight; };
        const cmds = {
            help: () => `<span class="acc">Commandes</span>
  whoami            qui je suis
  ls                le contenu du bureau
  cat parcours.txt  mon parcours
  stack             mes technologies
  open &lt;app&gt;        devtoolbox · boxcraft · app · contact
  contact           me joindre
  clear             vider l'écran`,
            whoami: () => `${esc(me.name)} — ${esc(me.role)}\n<span class="dim">${esc(me.location)} · ${esc(me.status)}</span>`,
            ls: () => Object.values(APPS).map((a) => `<span class="acc">${esc(a.label)}</span>`).join('   '),
            'cat parcours.txt': () => P.parcours.map((s) => `<span class="ok">${esc(s.date)}</span>  ${esc(s.title)} <span class="dim">— ${esc(s.org)}</span>`).join('\n'),
            stack: () => P.stack.map((g) => `<span class="warn">${esc(g.group.padEnd(16))}</span>${g.items.map(esc).join(', ')}`).join('\n'),
            contact: () => `mail      <a href="mailto:${me.email}">${me.email}</a>\ngithub    <a href="${me.github}" target="_blank" rel="noopener">${me.github}</a>\nlinkedin  <a href="${me.linkedin}" target="_blank" rel="noopener">linkedin/allan-vitu</a>`,
        };
        input.closest('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const raw = input.value.trim();
            input.value = '';
            print(`<span class="ok">allan@os</span><span class="dim">:~$</span> ${esc(raw)}`);
            if (!raw) return;
            if (raw === 'clear') { out.innerHTML = ''; return; }
            const m = raw.match(/^open\s+(\w+)$/);
            if (m) {
                if (APPS[m[1]]) { open(m[1]); print(`<span class="dim">ouverture de ${esc(m[1])}…</span>`); }
                else print(`<span class="warn">open: application inconnue « ${esc(m[1])} »</span>`);
                return;
            }
            print(cmds[raw] ? cmds[raw]() : `<span class="warn">commande introuvable : ${esc(raw)}</span> <span class="dim">— tape help</span>`);
        });
        // Boot sequence, typed out once.
        const boot = [
            '<span class="dim">allan.os 26.9 — tty1</span>',
            `<span class="ok">✓</span> ${P.projects.filter((p) => p.status === 'live').length} projets montés`,
            `<span class="ok">✓</span> statut : ${esc(me.status)}`,
            'Tape <span class="acc">help</span> pour commencer.',
        ];
        let i = 0;
        const next = () => { if (i < boot.length) { print(boot[i++]); setTimeout(next, P.reduceMotion ? 0 : 260); } };
        next();
        setTimeout(() => { if (!mobile()) input.focus(); }, 50);
    }

    function renderProject(b, id) {
        const p = P.byId(id);
        const w = b.closest('.win');
        w.style.setProperty('--accent', p.color);
        const tabs = ['Aperçu', 'Captures', 'Technique'];
        const inv = p.items ? `<div class="inv"><h4>Inventaire — ${p.items.length} objets</h4><div class="slots">${p.items.map(([n, src, kind]) => `
            <span class="slot" tabindex="0"><img class="${kind === 'px' ? 'px' : ''}" src="${src}" alt="${esc(n)}"><span class="tt">${esc(n)}</span></span>`).join('')}</div></div>` : '';
        const links = `<div class="btns">
            ${p.live ? `<a class="btn primary" href="${p.live}" target="_blank" rel="noopener">Ouvrir ${esc(p.name)} ↗</a>` : ''}
            <a class="btn${p.live ? '' : ' primary'}" href="${p.repo}" target="_blank" rel="noopener">Code source ↗</a>
            <a class="btn" href="${p.page}">Étude de cas</a>
            <a class="btn" href="${P.doc}#${id}">Fiche technique</a>
        </div>`;
        b.innerHTML = `<div class="app">
            <aside role="tablist" aria-label="${esc(p.name)}">
                <div class="appname">${id === 'boxcraft' ? `<img src="${p.items[5][1]}" alt="" width="22" style="image-rendering:pixelated">` : p.icon} ${esc(p.name)}</div>
                ${tabs.map((t, i) => `<button type="button" role="tab" aria-selected="${i === 0}" data-tab="${i}">${t}</button>`).join('')}
            </aside>
            <div>
                <section data-panel="0">
                    <p class="mono" style="font-size:12px;color:var(--accent)">${esc(p.kind)} · ${esc(p.period)}</p>
                    <h3 style="margin-top:6px">${esc(p.name)}</h3>
                    <p class="tagline">${esc(p.tagline)}</p>
                    <div class="stats">${p.stats.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
                    ${inv}
                    <div class="story"><div><h4>Le problème</h4><p>${esc(p.problem)}</p></div><div><h4>Le choix</h4><p>${esc(p.solution)}</p></div></div>
                    ${links}
                </section>
                <section data-panel="1" hidden>
                    <figure class="gallery">
                        <div class="main"><img src="${p.shots[0][0]}" alt="${esc(p.shots[0][1])}"></div>
                        <figcaption>${esc(p.shots[0][1])}</figcaption>
                        <div class="thumbs">${p.shots.map(([src, cap], i) => `<button type="button" aria-current="${i === 0}" data-shot="${i}" aria-label="${esc(cap)}"><img src="${src}" alt="" loading="lazy"></button>`).join('')}</div>
                    </figure>
                </section>
                <section data-panel="2" hidden>
                    <h3>Sous le capot</h3>
                    <ul class="hl">${p.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul>
                    <div class="chips" style="margin-bottom:18px">${p.tags.map((t) => `<span class="chip">${esc(t)}</span>`).join('')}</div>
                    ${links}
                </section>
            </div>
        </div>`;
        b.querySelectorAll('[data-tab]').forEach((t) => t.addEventListener('click', () => {
            b.querySelectorAll('[data-tab]').forEach((o) => o.setAttribute('aria-selected', String(o === t)));
            b.querySelectorAll('[data-panel]').forEach((s) => { s.hidden = s.dataset.panel !== t.dataset.tab; });
        }));
        b.querySelectorAll('[data-shot]').forEach((btn) => btn.addEventListener('click', () => {
            const [src, cap] = p.shots[+btn.dataset.shot];
            const img = $('.main img', b);
            img.src = src; img.alt = cap;
            $('figcaption', b).textContent = cap;
            b.querySelectorAll('[data-shot]').forEach((o) => o.setAttribute('aria-current', String(o === btn)));
        }));
    }

    function renderApp(b) {
        const p = P.byId('app');
        b.innerHTML = `<div class="installer">
            <div class="big" aria-hidden="true">🚀</div>
            <h3>${esc(p.name)}</h3>
            <p class="muted" style="max-width:34ch;font-size:14px">${esc(p.summary)}</p>
            <div class="bar" role="progressbar" aria-label="Avancement" aria-valuenow="12" aria-valuemin="0" aria-valuemax="100"><i></i></div>
            <p class="mono muted" style="font-size:12px">en attente du premier commit…</p>
            <a class="btn" href="${p.repo}" target="_blank" rel="noopener">Suivre le dépôt ↗</a>
        </div>`;
    }

    function renderContact(b) {
        b.innerHTML = `<div class="mail">
            <div class="row"><span>À</span><b>${esc(me.email)}</b></div>
            <div class="row"><span>Objet</span>Travaillons ensemble</div>
            <div class="body">
                <p>Bonjour Allan,</p>
                <p style="margin-top:10px">Diplômé DWWM, disponible en freelance comme en CDI — architecture, PWA, CI/CD ou intégration IA : parlons de votre projet.</p>
                <div class="btns" style="margin-top:22px">
                    <a class="btn primary" href="mailto:${me.email}?subject=${encodeURIComponent('Travaillons ensemble')}">Envoyer ✉</a>
                    <a class="btn" href="${me.github}" target="_blank" rel="noopener">GitHub ↗</a>
                    <a class="btn" href="${me.linkedin}" target="_blank" rel="noopener">LinkedIn ↗</a>
                    <a class="btn" href="${me.instagram}" target="_blank" rel="noopener">Instagram ↗</a>
                </div>
            </div>
        </div>`;
    }

    /* ------------------------------------------------------------ first boot
       #devtoolbox (or any app id) in the URL opens that window: shareable deep links. */
    const deep = location.hash.slice(1);
    if (APPS[deep]) open(deep);
    else if (!mobile()) { open('about'); open('parcours'); }
    addEventListener('hashchange', () => open(location.hash.slice(1)));
})();
</script>
</body>
</html>

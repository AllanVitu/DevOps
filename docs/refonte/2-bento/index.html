<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bento — Allan Vitu</title>
<meta name="description" content="Prototype 2 — le portfolio d'Allan Vitu en grille bento.">
<link rel="icon" href="../../assets/brand/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root {
    --font: 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
    --mono: 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --bg: #eeeef1;
    --tile: #ffffff;
    --ink: #111216;
    --muted: #5d6271;
    --subtle: #8b90a0;
    --line: rgba(17, 18, 22, 0.08);
    --indigo: #5b5bf0;
    --amber: #f5a524;
    --emerald: #10b981;
    --r: 28px;
    --gap: 14px;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
}
:root:not([data-theme='light']) { color-scheme: light; }
@media (prefers-color-scheme: dark) {
    :root:not([data-theme='light']) {
        --bg: #0b0b0e; --tile: #16171c; --ink: #f1f2f5; --muted: #a2a6b3; --subtle: #767b8a;
        --line: rgba(255,255,255,0.08); color-scheme: dark;
    }
}
:root[data-theme='dark'] {
    --bg: #0b0b0e; --tile: #16171c; --ink: #f1f2f5; --muted: #a2a6b3; --subtle: #767b8a;
    --line: rgba(255,255,255,0.08); color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
img { display: block; max-width: 100%; height: auto; }
:focus-visible { outline: 3px solid var(--indigo); outline-offset: 3px; border-radius: 12px; }

/* ---------------------------------------------------------------- grid */
.bento {
    max-width: 1440px; margin: 0 auto; padding: 20px;
    display: grid; gap: var(--gap);
    grid-template-columns: repeat(12, minmax(0, 1fr));
    /* Four rows that share the viewport: the page barely scrolls on a laptop. */
    grid-template-rows: repeat(4, minmax(180px, calc((100svh - 40px - 3 * var(--gap)) / 4)));
}
.tile {
    position: relative; overflow: hidden;
    background: var(--tile); border-radius: var(--r);
    padding: 24px;
    border: 1px solid var(--line);
    transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease);
    animation: rise 0.7s var(--ease) both;
    animation-delay: calc(var(--i, 0) * 60ms);
}
/* Soft spotlight that follows the pointer (set by JS). */
.tile::after {
    content: ''; position: absolute; inset: 0; pointer-events: none; border-radius: inherit;
    background: radial-gradient(360px circle at var(--mx, -999px) var(--my, -999px), color-mix(in srgb, var(--accent, var(--indigo)) 12%, transparent), transparent 70%);
    transition: opacity 0.3s; opacity: 0;
}
.tile:hover::after { opacity: 1; }
.tile.link { cursor: pointer; }
.tile.link:hover { transform: translateY(-4px); box-shadow: 0 22px 50px rgba(17, 18, 40, 0.12); }
@keyframes rise { from { opacity: 0; transform: translateY(16px) scale(0.985); } }

.eyebrow { font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--subtle); }
.tile.link .eyebrow { padding-right: 48px; }
.tile h2 { font-size: 26px; letter-spacing: -0.03em; line-height: 1.05; font-weight: 800; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 500 12px var(--mono); padding: 5px 10px; border-radius: 99px; background: color-mix(in srgb, var(--ink) 5%, transparent); color: var(--muted); white-space: nowrap; }
.arrow { position: absolute; top: 20px; right: 20px; width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--ink) 6%, transparent); transition: transform 0.3s var(--ease), background 0.3s; z-index: 2; }
.tile.link:hover .arrow { transform: rotate(-45deg); background: var(--accent, var(--indigo)); color: #fff; }

/* ---------------------------------------------------------------- tiles */
.t-intro { grid-column: 1 / 6; grid-row: 1 / 3; display: flex; flex-direction: column; padding: 34px; }
.t-intro .status { display: inline-flex; align-items: center; gap: 8px; align-self: flex-start; font-size: 13px; font-weight: 600; padding: 7px 13px; border-radius: 99px; background: color-mix(in srgb, var(--emerald) 13%, transparent); color: #047857; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .t-intro .status { color: #6ee7b7; } }
.t-intro .status::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); animation: ping 2.4s infinite; }
@keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(16,185,129,0.5); } 70%, 100% { box-shadow: 0 0 0 8px transparent; } }
.t-intro h1 { font-size: clamp(44px, 5.6vw, 84px); line-height: 0.92; letter-spacing: -0.055em; font-weight: 800; margin-top: auto; }
.t-intro .role { font-size: 19px; font-weight: 600; margin-top: 16px; }
.t-intro p { color: var(--muted); font-size: 16px; line-height: 1.5; margin-top: 8px; max-width: 38ch; }
.t-intro .ctas { display: flex; gap: 10px; margin-top: 24px; flex-wrap: wrap; }
.btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; padding: 13px 20px; border-radius: 99px; transition: transform 0.2s var(--ease), background 0.2s; }
.btn.dark { background: var(--ink); color: var(--tile); }
.btn.soft { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.btn:hover { transform: translateY(-2px); }

.t-dtb { grid-column: 6 / 11; grid-row: 1 / 3; --accent: var(--indigo); background: linear-gradient(160deg, #ecebff, #f7f7ff 55%); padding: 30px; }
@media (prefers-color-scheme: dark) { :root:not([data-theme='light']) .t-dtb { background: linear-gradient(160deg, #1d1b3f, #16171c 60%); } }
:root[data-theme='dark'] .t-dtb { background: linear-gradient(160deg, #1d1b3f, #16171c 60%); }
.t-dtb .kind { color: var(--indigo); }
.t-dtb h2 { font-size: 40px; margin-top: 8px; }
.t-dtb p { color: var(--muted); max-width: 34ch; margin-top: 10px; line-height: 1.5; font-size: 15px; }
.t-dtb .nums { display: flex; gap: 26px; margin-top: 18px; }
.t-dtb .nums b { display: block; font-size: 34px; letter-spacing: -0.04em; line-height: 1; }
.t-dtb .nums span { font-size: 12.5px; color: var(--muted); }
.t-dtb .shot {
    position: absolute; left: 30px; right: -70px; top: calc(46% + 20px);
    border-radius: 14px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 30px 60px rgba(40, 40, 110, 0.22);
    transform: rotate(-3deg); transform-origin: top left;
    transition: transform 0.5s var(--ease);
}
.t-dtb:hover .shot { transform: rotate(-1.5deg) translateY(-10px); }

.t-photo { grid-column: 11 / 13; grid-row: 1 / 2; padding: 0; }
.t-photo img { width: 100%; height: 100%; object-fit: cover; object-position: center 20%; }
.t-photo figcaption { position: absolute; left: 12px; bottom: 12px; font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 99px; background: rgba(255,255,255,0.85); color: #111; backdrop-filter: blur(8px); }

.t-git { grid-column: 11 / 13; grid-row: 2 / 3; display: flex; flex-direction: column; justify-content: space-between; background: var(--ink); color: var(--tile); }
.t-git { padding: 20px 22px; }
.t-git .big { font-size: 34px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; display: inline; margin-right: 6px; }
.t-git .eyebrow { color: color-mix(in srgb, var(--tile) 55%, transparent); margin-bottom: 4px; }
.t-git a { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; padding: 6px 0; border-top: 1px solid color-mix(in srgb, var(--tile) 15%, transparent); }
.t-git a:hover { color: var(--amber); }

.t-bc { grid-column: 1 / 5; grid-row: 3 / 5; --accent: var(--amber); background: #15171f; color: #f3f4f7; border-color: #242733; }
.t-bc .logo { width: 70%; max-width: 260px; image-rendering: pixelated; margin-top: 10px; }
.t-bc .eyebrow { color: #fbbf24; }
.t-bc p { color: #a7adbd; font-size: 14px; line-height: 1.5; margin-top: 10px; max-width: 36ch; }
.t-bc .rack { position: absolute; left: 20px; right: 20px; bottom: 20px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.t-bc .rack span { aspect-ratio: 1; border-radius: 12px; background: #0e1016; border: 1px solid #262a36; display: grid; place-items: center; transition: transform 0.3s var(--ease), border-color 0.3s; }
.t-bc .rack img { width: 86%; }
.t-bc:hover .rack span { border-color: #4a4230; }
.t-bc .rack span:hover { transform: translateY(-5px) rotate(-4deg); }
.t-bc .arrow { background: rgba(255,255,255,0.08); }

.t-path { grid-column: 5 / 9; grid-row: 3 / 5; }
.t-path ol { list-style: none; margin-top: 16px; display: grid; gap: 0; position: relative; }
.t-path ol::before { content: ''; position: absolute; left: 5px; top: 8px; bottom: 8px; width: 2px; background: linear-gradient(var(--indigo), var(--amber), var(--emerald)); border-radius: 2px; opacity: 0.5; }
.t-path li { display: grid; grid-template-columns: 22px 94px 1fr; align-items: baseline; padding: 8px 0; }
.t-path li::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--tile); border: 3px solid var(--dot, var(--indigo)); align-self: center; position: relative; }
.t-path time { font: 500 12px var(--mono); color: var(--subtle); }
.t-path b { font-size: 15px; letter-spacing: -0.01em; }
.t-path li span { display: block; font-size: 12.5px; color: var(--muted); font-weight: 400; }

.t-stack { grid-column: 9 / 13; grid-row: 3 / 4; }
.t-stack .cloud { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.t-stack .chip.hot { background: color-mix(in srgb, var(--indigo) 12%, transparent); color: var(--indigo); }

.t-app { grid-column: 9 / 11; grid-row: 4 / 5; --accent: var(--emerald); background: repeating-linear-gradient(135deg, transparent 0 12px, color-mix(in srgb, var(--emerald) 7%, transparent) 12px 24px), var(--tile); border: 2px dashed color-mix(in srgb, var(--emerald) 45%, transparent); display: flex; flex-direction: column; justify-content: space-between; }
.t-app h2 { font-size: 30px; }
.t-app p { font-size: 13px; color: var(--muted); line-height: 1.45; }

.t-contact { grid-column: 11 / 13; grid-row: 4 / 5; --accent: var(--indigo); background: var(--indigo); color: #fff; display: flex; flex-direction: column; justify-content: space-between; border: 0; }
.t-contact .eyebrow { color: rgba(255,255,255,0.7); }
.t-contact h2 { font-size: 24px; }
.t-contact .soc { display: flex; gap: 8px; }
.t-contact .soc a { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; background: rgba(255,255,255,0.16); transition: background 0.2s; }
.t-contact .soc a:hover { background: rgba(255,255,255,0.3); }
.t-contact svg { width: 16px; height: 16px; fill: currentColor; }

/* ---------------------------------------------------------------- detail sheet */
dialog {
    border: 0; padding: 0; margin: auto; width: min(980px, calc(100vw - 24px)); max-height: calc(100svh - 24px);
    border-radius: 30px; background: var(--tile); color: var(--ink); overflow: auto;
    box-shadow: 0 40px 120px rgba(0,0,0,0.35);
}
dialog::backdrop { background: rgba(10, 10, 20, 0.45); backdrop-filter: blur(6px); }
dialog[open] { animation: sheet 0.45s var(--ease); }
@keyframes sheet { from { opacity: 0; transform: translateY(30px) scale(0.98); } }
.sheet-head { padding: 34px 34px 0; display: grid; grid-template-columns: 1fr auto; gap: 20px; }
.sheet-head h2 { font-size: 44px; letter-spacing: -0.045em; line-height: 1; font-weight: 800; margin-top: 6px; }
.sheet-head p { color: var(--muted); margin-top: 10px; font-size: 16px; max-width: 60ch; line-height: 1.5; }
.close { width: 44px; height: 44px; border-radius: 50%; background: color-mix(in srgb, var(--ink) 7%, transparent); font-size: 20px; }
.sheet-gal { padding: 24px 34px 0; }
.sheet-gal .main { border-radius: 18px; overflow: hidden; border: 1px solid var(--line); background: #0e1016; aspect-ratio: 16 / 9.56; }
.sheet-gal .main img { width: 100%; height: 100%; object-fit: cover; object-position: top; }
.sheet-gal .thumbs { display: flex; gap: 8px; margin-top: 10px; overflow-x: auto; }
.sheet-gal .thumbs button { flex: none; width: 110px; border-radius: 10px; overflow: hidden; border: 2px solid transparent; opacity: 0.55; transition: opacity 0.2s; }
.sheet-gal .thumbs button[aria-current='true'] { border-color: var(--accent); opacity: 1; }
.sheet-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; padding: 24px 34px 34px; }
.sheet-grid > div { background: color-mix(in srgb, var(--ink) 4%, transparent); border-radius: 20px; padding: 20px; }
.sheet-grid h3 { font: 500 11.5px var(--mono); text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); margin-bottom: 8px; }
.sheet-grid p, .sheet-grid li { font-size: 14px; color: var(--muted); line-height: 1.55; }
.sheet-grid ul { list-style: none; display: grid; gap: 6px; }
.sheet-grid li::before { content: '→ '; color: var(--accent); }
.sheet-stats { display: flex; gap: 28px; padding: 22px 34px 0; flex-wrap: wrap; }
.sheet-stats b { display: block; font-size: 34px; letter-spacing: -0.04em; color: var(--accent); line-height: 1; }
.sheet-stats span { font-size: 13px; color: var(--muted); }
.sheet-actions { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 34px 34px; }
.btn.accent { background: var(--accent); color: #fff; }

/* ---------------------------------------------------------------- responsive */
@media (max-width: 1180px) {
    .bento { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: none; grid-auto-rows: minmax(210px, auto); }
    .t-intro { grid-column: 1 / 7; grid-row: auto; min-height: 420px; }
    .t-dtb { grid-column: 1 / 5; grid-row: span 2; }
    .t-photo { grid-column: 5 / 7; grid-row: auto; }
    .t-git { grid-column: 5 / 7; grid-row: auto; }
    .t-bc { grid-column: 1 / 4; grid-row: span 2; min-height: 440px; }
    .t-path { grid-column: 4 / 7; grid-row: span 2; }
    .t-stack { grid-column: 1 / 7; grid-row: auto; }
    .t-app { grid-column: 1 / 4; grid-row: auto; }
    .t-contact { grid-column: 4 / 7; grid-row: auto; }
}
@media (max-width: 700px) {
    .bento { grid-template-columns: 1fr; padding: 12px; --gap: 12px; }
    .bento > * { grid-column: 1 / -1 !important; grid-row: auto !important; }
    .t-intro { padding: 26px; min-height: 0; }
    .t-intro h1 { margin-top: 40px; }
    .t-dtb { min-height: 480px; }
    .t-dtb .shot { width: 92%; }
    .t-photo { height: 260px; }
    .t-bc { min-height: 400px; }
    .sheet-head, .sheet-gal, .sheet-grid, .sheet-actions, .sheet-stats { padding-left: 20px; padding-right: 20px; }
    .sheet-head h2 { font-size: 34px; }
    .sheet-grid { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="bento" id="bento"></main>
<dialog id="sheet" aria-labelledby="sheet-title"></dialog>

<script src="../data.js"></script>
<script>
(() => {
    'use strict';
    const P = window.PORTFOLIO, esc = P.esc, me = P.person;
    const dtb = P.byId('devtoolbox'), bc = P.byId('boxcraft'), app = P.byId('app');

    const svg = {
        gh: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 0-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.3-.5-1.5.2-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.7.2 2.9.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.5.4.9 1.1.9 2.2v3.3c0 .3.1.7.8.6A12 12 0 0 0 12 .3"/></svg>',
        in: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 20.5h-3.5v-5.6c0-1.3 0-3-1.9-3s-2.1 1.4-2.1 2.9v5.7H9.3V9h3.4v1.6c.5-.9 1.6-1.9 3.4-1.9 3.6 0 4.3 2.4 4.3 5.5v6.3zM5.3 7.4a2 2 0 1 1 0-4.1 2 2 0 0 1 0 4.1zm1.8 13.1H3.6V9h3.5v11.5zM22.2 0H1.8C.8 0 0 .8 0 1.7v20.6c0 .9.8 1.7 1.8 1.7h20.4c1 0 1.8-.8 1.8-1.7V1.7C24 .8 23.2 0 22.2 0z"/></svg>',
        ig: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.2c3.2 0 3.6 0 4.8.1 3.3.1 4.8 1.7 4.9 4.9.1 1.3.1 1.6.1 4.8s0 3.6-.1 4.8c-.1 3.2-1.7 4.8-4.9 4.9-1.3.1-1.6.1-4.8.1s-3.6 0-4.8-.1c-3.3-.1-4.8-1.7-4.9-4.9C2.2 15.6 2.2 15.2 2.2 12s0-3.6.1-4.8C2.4 3.9 3.9 2.4 7.2 2.3 8.4 2.2 8.8 2.2 12 2.2zM12 0C8.7 0 8.3 0 7.1.1 2.7.3.3 2.7.1 7.1 0 8.3 0 8.7 0 12s0 3.7.1 4.9c.2 4.4 2.6 6.8 7 7 1.2.1 1.6.1 4.9.1s3.7 0 4.9-.1c4.4-.2 6.8-2.6 7-7 .1-1.2.1-1.6.1-4.9s0-3.7-.1-4.9c-.2-4.4-2.6-6.8-7-7C15.7 0 15.3 0 12 0zm0 5.8a6.2 6.2 0 1 0 0 12.4 6.2 6.2 0 0 0 0-12.4zM12 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm6.4-11.8a1.4 1.4 0 1 0 0 2.9 1.4 1.4 0 0 0 0-2.9z"/></svg>',
        mail: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 4h20v16H2zm2 2v.5l8 5 8-5V6zm16 2.8-8 5-8-5V18h16z"/></svg>',
    };
    const arrow = '<span class="arrow" aria-hidden="true">↗</span>';
    const dots = ['var(--subtle)', 'var(--indigo)', 'var(--amber)', 'var(--emerald)', 'var(--ink)'];

    const tiles = [
        `<section class="tile t-intro" style="--i:0">
            <span class="status">${esc(me.status)}</span>
            <h1>${esc(me.first)}<br>${esc(me.last)}</h1>
            <p class="role">${esc(me.role)}</p>
            <p>${esc(me.pitch)} Deux projets publiés, un troisième en route.</p>
            <div class="ctas">
                <a class="btn dark" href="mailto:${me.email}">Me contacter</a>
                <a class="btn soft" href="${P.doc}">Fiche technique</a>
            </div>
        </section>`,

        `<article class="tile link t-dtb" style="--i:1" tabindex="0" role="button" data-open="devtoolbox" aria-label="Ouvrir la fiche DevToolbox">
            ${arrow}
            <p class="eyebrow kind">${esc(dtb.kind)}</p>
            <h2>${esc(dtb.name)}</h2>
            <div class="nums">${dtb.stats.slice(0, 3).map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
            <img class="shot" src="${dtb.cover}" alt="Tableau de bord de DevToolbox" width="1600" height="956">
        </article>`,

        `<figure class="tile t-photo" style="--i:2">
            <img src="${me.avatar}" alt="Portrait d’Allan Vitu">
            <figcaption>📍 ${esc(me.location)}</figcaption>
        </figure>`,

        `<section class="tile t-git" style="--i:3">
            <div><p class="eyebrow">GitHub</p><p><span class="big">${P.projects.length}</span><span style="font-size:13px;opacity:.7">dépôts publics</span></p></div>
            <div>${P.projects.map((p) => `<a href="${p.repo}" target="_blank" rel="noopener">${esc(p.repoName)} <span>↗</span></a>`).join('')}</div>
        </section>`,

        `<article class="tile link t-bc" style="--i:4" tabindex="0" role="button" data-open="boxcraft" aria-label="Ouvrir la fiche BoxCraft">
            ${arrow}
            <p class="eyebrow">${esc(bc.kind)} · ${esc(bc.period)}</p>
            <img class="logo" src="${bc.logo}" alt="BoxCraft" width="448" height="96">
            <p>${esc(bc.tagline)}</p>
            <div class="rack">${bc.items.slice(0, 5).map(([n, src]) => `<span title="${esc(n)}"><img src="${src}" alt="${esc(n)}"></span>`).join('')}</div>
        </article>`,

        `<section class="tile t-path" style="--i:5">
            <p class="eyebrow">Parcours</p>
            <ol>${P.parcours.map((s, i) => `<li style="--dot:${dots[i]}"><time>${esc(s.date)}</time><b>${esc(s.title)}<span>${esc(s.org)}</span></b></li>`).join('')}</ol>
        </section>`,

        `<section class="tile t-stack" style="--i:6">
            <p class="eyebrow">Stack</p>
            <div class="cloud">${P.stack.flatMap((g, gi) => g.items.map((it) => `<span class="chip${gi === 0 ? ' hot' : ''}">${esc(it)}</span>`)).join('')}</div>
        </section>`,

        `<a class="tile link t-app" style="--i:7" href="${app.repo}" target="_blank" rel="noopener">
            ${arrow}
            <p class="eyebrow">${esc(app.kind)}</p>
            <div><h2>${esc(app.name)}</h2><p>${esc(app.tagline)}</p></div>
        </a>`,

        `<section class="tile t-contact" style="--i:8">
            <p class="eyebrow">Contact</p>
            <h2>Travaillons<br>ensemble.</h2>
            <div class="soc">
                <a href="mailto:${me.email}" aria-label="E-mail">${svg.mail}</a>
                <a href="${me.github}" target="_blank" rel="noopener" aria-label="GitHub">${svg.gh}</a>
                <a href="${me.linkedin}" target="_blank" rel="noopener" aria-label="LinkedIn">${svg.in}</a>
                <a href="${me.instagram}" target="_blank" rel="noopener" aria-label="Instagram">${svg.ig}</a>
            </div>
        </section>`,
    ];
    const grid = document.getElementById('bento');
    grid.innerHTML = tiles.join('');

    /* ------------------------------------------------------------ pointer spotlight */
    grid.addEventListener('pointermove', (e) => {
        const t = e.target.closest('.tile');
        if (!t) return;
        const r = t.getBoundingClientRect();
        t.style.setProperty('--mx', `${e.clientX - r.left}px`);
        t.style.setProperty('--my', `${e.clientY - r.top}px`);
    });

    /* ------------------------------------------------------------ detail sheet */
    const sheet = document.getElementById('sheet');
    function openSheet(id) {
        const p = P.byId(id);
        sheet.style.setProperty('--accent', p.color === '#fbbf24' ? '#d98a06' : p.color);
        sheet.innerHTML = `
            <header class="sheet-head">
                <div>
                    <p class="eyebrow">${esc(p.kind)} · ${esc(p.period)}</p>
                    <h2 id="sheet-title">${esc(p.name)}</h2>
                    <p>${esc(p.summary)}</p>
                </div>
                <button class="close" type="button" aria-label="Fermer">✕</button>
            </header>
            <div class="sheet-stats">${p.stats.map(([v, l]) => `<div><b>${esc(v)}</b><span>${esc(l)}</span></div>`).join('')}</div>
            <figure class="sheet-gal">
                <div class="main"><img src="${p.shots[0][0]}" alt="${esc(p.shots[0][1])}"></div>
                <div class="thumbs">${p.shots.map(([src, cap], i) => `<button type="button" data-shot="${i}" aria-current="${i === 0}" aria-label="${esc(cap)}"><img src="${src}" alt="" loading="lazy"></button>`).join('')}</div>
            </figure>
            <div class="sheet-grid">
                <div><h3>Le problème</h3><p>${esc(p.problem)}</p></div>
                <div><h3>Le choix</h3><p>${esc(p.solution)}</p></div>
                <div><h3>Sous le capot</h3><ul>${p.highlights.map((h) => `<li>${esc(h)}</li>`).join('')}</ul></div>
            </div>
            <div class="sheet-actions">
                ${p.live ? `<a class="btn accent" href="${p.live}" target="_blank" rel="noopener">Ouvrir ${esc(p.name)} ↗</a>` : ''}
                <a class="btn ${p.live ? 'soft' : 'accent'}" href="${p.repo}" target="_blank" rel="noopener">Code source ↗</a>
                <a class="btn soft" href="${p.page}">Étude de cas</a>
                <a class="btn soft" href="${P.doc}#${p.id}">Fiche technique</a>
            </div>`;
        sheet.querySelector('.close').addEventListener('click', () => sheet.close());
        sheet.querySelectorAll('[data-shot]').forEach((b) => b.addEventListener('click', () => {
            const [src, cap] = p.shots[+b.dataset.shot];
            const img = sheet.querySelector('.main img');
            img.src = src; img.alt = cap;
            sheet.querySelectorAll('[data-shot]').forEach((o) => o.setAttribute('aria-current', String(o === b)));
        }));
        sheet.showModal();
    }
    sheet.addEventListener('click', (e) => { if (e.target === sheet) sheet.close(); });
    grid.addEventListener('click', (e) => {
        const t = e.target.closest('[data-open]');
        if (t && !e.target.closest('a')) openSheet(t.dataset.open);
    });
    grid.addEventListener('keydown', (e) => {
        const t = e.target.closest('[data-open]');
        if (t && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openSheet(t.dataset.open); }
    });

    const deep = location.hash.slice(1);
    if (P.byId(deep)?.shots) openSheet(deep);
})();
</script>
</body>
</html>
